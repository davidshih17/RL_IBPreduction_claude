integralfamilies:

  - name: "GR"
    loop_momenta: [k1, k2, k3]
    top_level_sectors: [1023]          # all 10 denominators
    propagators:
      # --- quadratic denominators (momentum -> squared) ---
      - [ "k1", 0 ]                     # D1  = k1^2
      - [ "k2", 0 ]                     # D2  = k2^2
      - [ "k3", 0 ]                     # D3  = k3^2
      - [ "k1+k2+k3-q", 0 ]            # D4  = (k1+k2+k3-q)^2
      # --- LINEAR / eikonal denominators (NOT a momentum-square) ---
      - [ "2*k1*u1+2*k2*u1", 0 ]       # D5  = 2(k1+k2).u1     <-- linear
      - [ "-2*k1*u2", 0 ]              # D6  = -2 k1.u2        <-- linear
      - [ "-2*k1*u2-2*k2*u2-2*k3*u2", 0 ]  # D7 = -2(k1+k2+k3).u2  <-- linear
      # --- quadratic denominators ---
      - [ "k1+k2", 0 ]                 # D8  = (k1+k2)^2
      - [ "k1+k2-q", 0 ]              # D9  = (k1+k2-q)^2
      - [ "k2+k3", 0 ]                # D10 = (k2+k3)^2
      # --- ISPs (positions 11-15) ---
      - [ "k2*u2", 0 ]                 # D11 = k2.u2           <-- linear ISP
      - [ "k1*u1", 0 ]                 # D12 = k1.u1           <-- linear ISP
      - [ "k3*u1", 0 ]                 # D13 = k3.u1           <-- linear ISP
      - [ "k1*k3", 0 ]                 # D14 = k1.k3           <-- bilinear ISP
      - [ "k1*q", 0 ]                  # D15 = k1.q            <-- linear ISP
